<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giảm cân 15 tuần</title>
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL 15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EB; --card:#FFFFFF; --card2:#F7F5F1; --line:#E3DFD7; --ink:#1A1C21; --muted:#6A6F7A;
  --accent:#9A6E0A; --accent-ink:#FFFFFF; --accent-soft:#F5E9CC; --good:#2B7A6D; --good-soft:#DDEFEA;
  --bad:#B9503D; --chip:#EAE7E0;
  --num:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --card:#1C1F25; --card2:#232730; --line:#30343D; --ink:#ECEAE4; --muted:#8C919C;
    --accent:#F0BE4B; --accent-ink:#17181C; --accent-soft:#3A3220; --good:#79BCAE; --good-soft:#1F3330;
    --bad:#E07E6C; --chip:#262A32;
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --card:#1C1F25; --card2:#232730; --line:#30343D; --ink:#ECEAE4; --muted:#8C919C;
  --accent:#F0BE4B; --accent-ink:#17181C; --accent-soft:#3A3220; --good:#79BCAE; --good-soft:#1F3330;
  --bad:#E07E6C; --chip:#262A32;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.hd{padding:18px 2px 6px;display:flex;align-items:flex-end;gap:12px}
.hd-l{flex:1;min-width:0}
.hd-date{color:var(--muted);font-size:14px}
.hd-title{font-family:var(--num);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.005em}
.hd-title small{font-size:20px;color:var(--muted);font-weight:500}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:6px}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--good)}
.wkbar{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:8px 2px 4px}
.wkbar span{height:5px;border-radius:3px;background:var(--line)}
.wkbar span.done{background:var(--good)}
.wkbar span.now{background:var(--accent)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{margin:0;font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.01em}
.card-h .aside{font-size:13px;color:var(--muted)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;min-height:46px;padding:0 16px;font-weight:600;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin:0 0 10px}
.seg button{border:none;background:transparent;border-radius:9px;min-height:42px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:38px;padding:0 14px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:2px}
.chip.on .dot{background:var(--accent-ink)}

/* banner */
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.good{background:var(--good-soft)}
.note.plain{background:var(--card2)}

/* setup */
.setup p{margin:0 0 12px;color:var(--muted);font-size:15px}
.date-in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:0 12px;font-size:16px}

/* weight */
.w-row{display:flex;gap:8px}
.w-in{flex:1;min-width:0;min-height:56px;border:1px solid var(--line);border-radius:14px;background:var(--card2);text-align:center;font-family:var(--num);font-size:30px;font-weight:700;padding:0 10px}
.w-in:focus,.fld input:focus,.date-in:focus,.search input:focus,.sheet input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.w-row .btn{min-height:56px;padding:0 22px}
.w-stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.w-stat .v{font-family:var(--num);font-size:24px;font-weight:700;line-height:1.1}
.w-stat .l{font-size:12px;color:var(--muted)}
.w-stat .v.good{color:var(--good)}
.w-stat .v.bad{color:var(--bad)}
.w-stat .v.warn{color:var(--accent)}
.tips{margin:12px 0 0;padding:0;list-style:none}
.tips li{position:relative;padding:9px 0 9px 16px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.tips li:first-child{border-top:none}
.tips li::before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.linkbtn{border:none;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px 0 0}
.ex-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.rest-b{border:1px solid var(--line);background:var(--card2);border-radius:999px;min-height:30px;padding:0 11px;font-size:13px;font-weight:700;font-family:var(--num);letter-spacing:.02em;color:var(--ink)}
.rest-b:active{background:var(--accent);color:var(--accent-ink)}
.timer{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.t-in{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 7px 7px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:440px;width:100%}
.t-lab{font-size:13px;font-weight:600;opacity:.85}
.t-v{font-family:var(--num);font-size:28px;font-weight:700;flex:1;font-variant-numeric:tabular-nums}
.t-in button{border:none;border-radius:999px;min-height:42px;padding:0 14px;font-weight:700;font-size:14px;background:rgba(127,127,127,.28);color:inherit}
.timer.done .t-in{background:var(--good);color:#fff}
.rs{padding:12px 0;border-top:1px solid var(--line)}
.rs:first-child{border-top:none;padding-top:2px}
.rs h4{margin:0 0 4px;font-size:15px}
.rs p{margin:0 0 4px;font-size:14px}
.rs .src{font-size:12px;color:var(--muted)}
.steps{display:flex;align-items:center;gap:12px}
.st-in{width:120px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card2);text-align:center;font-family:var(--num);font-size:22px;font-weight:700}
.st-in:focus,.ib-f input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.st-bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.st-bar i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .3s ease}
.st-cap{font-size:12px;color:var(--muted);margin-top:4px}
.ib-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ib-f input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:0 12px;font-size:16px}
.ib-f .full{grid-column:1/-1}
.proj{background:var(--card2);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
.proj b{font-family:var(--num);font-size:18px}

/* workout */
.wk-step{display:flex;align-items:center;gap:2px}
.wk-step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:18px;line-height:1}
.wk-step span{font-family:var(--num);font-weight:600;font-size:17px;min-width:64px;text-align:center}
.wo-title{font-family:var(--num);font-size:28px;font-weight:700;margin:12px 0 2px;line-height:1.1}
.wo-sub{color:var(--muted);font-size:14px;margin-bottom:4px}
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:none}
.ex.dim{opacity:.45}
.ex-top{display:flex;gap:10px;align-items:flex-start}
.ex-no{flex:0 0 26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px;color:var(--muted)}
.ex-name{font-weight:600;font-size:16px;line-height:1.25}
.ex-sub{font-size:13px;color:var(--muted)}
.ex-in{display:flex;align-items:center;gap:8px;margin:10px 0 0 36px}
.fld{position:relative;display:block}
.fld span{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.08em;color:var(--muted);pointer-events:none;text-transform:uppercase}
.fld input{width:70px;height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card2);text-align:center;font-family:var(--num);font-size:22px;font-weight:700;padding:12px 0 0;font-variant-numeric:tabular-nums}
.last{border:1px dashed var(--line);background:transparent;border-radius:10px;min-height:40px;padding:0 10px;font-size:13px;color:var(--muted);line-height:1.15;text-align:left}
.last b{font-family:var(--num);font-size:15px;color:var(--ink)}
.delta{margin-left:auto;font-family:var(--num);font-weight:700;font-size:18px;color:var(--muted);min-width:44px;text-align:right}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.45)}100%{transform:scale(1)}}
textarea.wo-note{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;font-size:15px;resize:vertical;margin-top:12px}
.cardio{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--card2);font-size:14px}
.cardio b{font-family:var(--num);font-size:16px}
.rest{text-align:center;padding:18px 6px 8px}
.rest .big{font-family:var(--num);font-size:30px;font-weight:700}
.rest p{color:var(--muted);margin:6px 0 0;font-size:15px}

/* macros */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mac .v{font-family:var(--num);font-size:26px;font-weight:700;line-height:1}
.mac .l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.mac .bar{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.mac .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.mac.hit .v{color:var(--good)}
.mac.hit .bar i{background:var(--good)}
.mac.over .v{color:var(--bad)}
.mac.over .bar i{background:var(--bad)}
.meal-g{margin-top:14px}
.meal-g h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:none}
.it-m{flex:1;min-width:0}
.it-n{font-size:15px;font-weight:500;line-height:1.25}
.it-q{font-size:13px;color:var(--muted)}
.it-k{font-family:var(--num);font-weight:700;font-size:18px}
.x{width:36px;height:36px;border-radius:10px;border:none;background:var(--card2);color:var(--muted);font-size:18px;line-height:1;flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px}
.tpl{margin-top:12px}
.tpl .lab{font-size:13px;color:var(--muted);margin-bottom:6px}

/* library */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
.search input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;font-size:16px}
.lib-list{margin-top:8px}
.lib-g{font-family:var(--num);font-weight:700;font-size:18px;margin:18px 2px 6px;color:var(--accent)}
.food{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:var(--card);border-radius:14px;padding:12px 14px;margin:6px 0;border:1px solid var(--line)}
.food:active{background:var(--card2)}
.food-m{flex:1;min-width:0}
.food-n{font-weight:600;font-size:15px;line-height:1.25}
.food-s{font-size:13px;color:var(--muted)}
.food-k{text-align:right}
.food-k .v{font-family:var(--num);font-weight:700;font-size:20px;line-height:1}
.food-k .l{font-size:11px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:center;pointer-events:none}
.dock div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.dock .n{font-size:16px}

/* progress */
.hero-v{font-family:var(--num);font-size:56px;font-weight:700;line-height:.95}
.hero-v small{font-size:22px;color:var(--muted);font-weight:500}
.track{height:8px;border-radius:4px;background:var(--line);margin:14px 0 6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:4px}
.track-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .v{font-family:var(--num);font-weight:700;font-size:18px}
.row .s{font-family:var(--num);font-size:15px;color:var(--muted);min-width:52px;text-align:right}
.lift-g{font-family:var(--num);font-weight:700;font-size:17px;color:var(--accent);margin:14px 0 2px}

/* plan */
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
summary{list-style:none;padding:15px 16px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--num);font-size:22px;color:var(--muted);line-height:1}
details[open] summary::after{content:"−"}
.dbody{padding:0 16px 14px;font-size:15px}
.dbody p{margin:0 0 10px}
.dbody ul{margin:0 0 10px;padding-left:20px}
.dbody li{margin:3px 0}
.pl-ex{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl-ex:last-child{border-bottom:none}
.pl-ex .s{margin-left:auto;font-family:var(--num);font-weight:600;color:var(--muted);white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv span:last-child{color:var(--muted);text-align:right}
.pgs{display:grid;gap:8px;margin:4px 0 6px}
.pg{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px}
.pg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pg b{font-family:var(--num);font-size:21px;font-weight:700}
.pg .s{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pg .tag{float:right;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-top:4px}
textarea.imp{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:none;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-t{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1;margin:0 0 2px}
.sh-s{color:var(--muted);font-size:14px;margin-bottom:14px}
.qty{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.qty button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:24px;line-height:1}
.qty input{flex:1;min-width:0;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--card2);text-align:center;font-family:var(--num);font-size:28px;font-weight:700}
.qty .u{font-size:15px;color:var(--muted);min-width:40px}
.prev{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card2);border-radius:14px;padding:12px;margin:10px 0 14px}
.prev div{text-align:center}
.prev .v{font-family:var(--num);font-size:22px;font-weight:700;line-height:1}
.prev .l{font-size:11px;color:var(--muted);margin-top:2px}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f2 input,.f1 input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:0 12px;font-size:16px}

/* ================= store (db sync + local cache) ================= */
const LS_KEY = "ppl15.v2";
const S = {docs:{}, col:null, pending:{}, inflight:{}, timer:null, cloud:false, needRender:false};

function lsLoad(){ try { const t = localStorage.getItem(LS_KEY); if (t) S.docs = JSON.parse(t) || {}; } catch(e) {} }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.docs)); } catch(e) {} }
const get = id => S.docs[id];

function put(id, data){
  S.docs[id] = data;
  lsSave();
  if (S.col){ S.pending[id] = data; schedule(500); }
}
function schedule(ms){ clearTimeout(S.timer); S.timer = setTimeout(flush, ms); }
async function flush(){
  if (!S.col) return;
  for (const id of Object.keys(S.pending)){
    if (S.inflight[id]) continue;
    const data = S.pending[id];
    delete S.pending[id];
    S.inflight[id] = true;
    try { await S.col.doc(id).set(data); }
    catch(e){
      const code = e && e.code;
      if (code === "unavailable" || code === "resource_exhausted"){
        if (!S.pending[id]) S.pending[id] = data;
        delete S.inflight[id];
        schedule(1500 + Math.random() * 1500);
        return;
      }
      if (code === "quota_exceeded"){ toast("Bộ nhớ đồng bộ đã đầy — dữ liệu chỉ còn lưu trên máy này"); }
      S.col = null; S.cloud = false; renderSync();
    }
    delete S.inflight[id];
  }
  if (Object.keys(S.pending).length) schedule(300);
}

async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") { renderSync(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { renderSync(); return; }
    const uid = await user.id();
    if (!uid) { renderSync(); return; }
    S.col = db.collection("data/users/" + uid);
    let first = true;
    S.col.onSnapshot(snap => {
      const remote = {};
      snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      if (first){
        first = false;
        Object.keys(S.docs).forEach(id => { if (!(id in remote)) S.pending[id] = S.docs[id]; });
        if (Object.keys(S.pending).length) schedule(200);
      }
      let changed = false;
      for (const id in remote){
        if (S.pending[id] || S.inflight[id]) continue;
        const v = JSON.stringify(remote[id]);
        if (JSON.stringify(S.docs[id]) !== v){ S.docs[id] = JSON.parse(v); changed = true; }
      }
      S.cloud = true; renderSync();
      if (changed){ lsSave(); softRender(); }
    }, () => { S.col = null; S.cloud = false; renderSync(); });
  } catch(e) { renderSync(); }
}

function softRender(){
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) { S.needRender = true; return; }
  render();
}
document.addEventListener("focusout", () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (S.needRender && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"))) { S.needRender = false; render(); }
  }, 60);
});

function startDate(){ const s = get("settings"); return s && s.startDate ? s.startDate : null; }
function progWeek(){
  const sd = startDate(); if (!sd) return null;
  return Math.floor((mondayOf(new Date()) - mondayOf(parseISO(sd))) / (7 * 864e5)) + 1;
}
const clampW = w => Math.max(1, Math.min(WEEKS, w || 1));
function targetsFor(week){
  if (week && week <= 2) return {kcal:[2200,2400], p:[170,190], f:[55,65], c:[170,250]};
  return {kcal:[1900,2100], p:[170,190], f:[55,65], c:[120,180]};
}
function weights(){ const w = get("weights"); return (w && w.map) || {}; }
function avg7(key, map){
  const end = parseISO(key).getTime(), start = end - 6 * 864e5;
  let s = 0, n = 0;
  for (const k in map){ const t = parseISO(k).getTime(); if (t >= start && t <= end){ s += map[k]; n++; } }
  return n >= 3 ? s / n : null;
}
function shiftISO(key, days){ const d = parseISO(key); d.setDate(d.getDate() + days); return iso(d); }
function dayItems(key){ const d = get("day_" + key); return (d && d.items) || []; }
function totals(items){ return items.reduce((t, it) => ({p:t.p+it.p, f:t.f+it.f, c:t.c+it.c, k:t.k+it.k}), {p:0,f:0,c:0,k:0}); }
const logId = (wid, w) => "log_" + wid + "_" + w;
function prevOf(wid, i, week){
  for (let w = week - 1; w >= 1; w--){
    const d = get(logId(wid, w));
    if (d && d.s && d.s[i] && typeof d.s[i].kg === "number") return {w, kg:d.s[i].kg, r:d.s[i].r};
  }
  return null;
}

const SLEEP = [["lt6","Dưới 6h"],["6-7","6–7h"],["7-8","7–8h"],["8p","Trên 8h"]];
function inbody(){ const d = get("inbody"); return ((d && d.entries) || []).slice().sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0); }
function latestBF(){ const e = inbody(); return e.length ? e[e.length - 1] : null; }
function fatHigh(){ const L = latestBF(); return !!(L && L.bf >= 25); }
function rateBand(){ return fatHigh() ? [0.7, 1.2] : [0.5, 1.0]; }
function phaseOf(week){
  if (week <= 2) return "Khớp lại nhịp";
  if (week === 8 || week === 9) return "Deload";
  if (week >= 11) return "Chặng cuối";
  return "Giảm mỡ + tăng tạ";
}
const restFor = i => i < 2 ? 180 : i < 4 ? 120 : 75;
function rirFor(i, week, sleep){
  if (week <= 2) return "dừng khi còn dư 3–4 rep";
  if (week === 8 || week === 9) return "dừng khi còn dư 4 rep";
  const tired = sleep === "lt6";
  if (i < 2) return tired ? "dừng khi còn dư 3 rep" : "dừng khi còn dư 2 rep";
  if (i < 4) return tired ? "dừng khi còn dư 2–3 rep" : "dừng khi còn dư 1–2 rep";
  return tired ? "dừng khi còn dư 2 rep" : "set cuối được sát thất bại";

function stepsCap(n){ if (!n) return "Mục tiêu 10.000–12.000 bước"; if (n >= 10000) return "Đạt mục tiêu · ~" + fmtK(n * 0.05) + " kcal từ đi lại"; return "Còn " + fmtK(10000 - n) + " bước nữa tới 10.000"; }
const mmss = s => Math.floor(s / 60) + ":" + pad(Math.max(0, Math.round(s % 60)));
function rateInfo(){
  const wm = weights(), tk = todayISO();
  const a = avg7(tk, wm), b = avg7(shiftISO(tk, -7), wm);
  if (a == null || b == null) return null;
  const kg = b - a, pct = kg / b * 100, pw = progWeek() || 0;
  const [lo, hi] = rateBand(), band = fmt(lo) + "–" + fmt(hi) + "%/tuần";
  let cls, msg;
  if (pct > hi){ cls = "warn"; msg = pw && pw <= 2 ? "Giảm nhanh ở tuần 1–2 chủ yếu do mất nước và glycogen — bình thường." : "Nhanh hơn vùng " + band + ". Nếu kéo dài 2 tuần, thêm 100–150 kcal/ngày để giữ cơ."; }
  else if (pct >= lo){ cls = "good"; msg = "Đúng vùng " + band + (fatHigh() ? " cho mức mỡ hiện tại — giảm mỡ tối đa mà vẫn giữ cơ." : " — tốc độ giữ cơ tốt nhất."); }
  else if (pct >= 0){ cls = "warn"; msg = "Chậm hơn vùng " + band + ". Theo dõi thêm 1 tuần; 2 tuần liền thì đi bộ thêm 2.000–3.000 bước/ngày trước, rồi mới tính cắt 100–150 kcal."; }
  else { cls = "bad"; msg = "Trung bình tuần đang tăng. Kiểm tra lại đồ uống, dầu ăn và các bữa ăn ngoài."; }
  return {kg, pct, cls, msg};
}

      <div class="w-stat"><div class="v">${latestAvg != null ? fmt(Math.max(0, latestAvg - GOAL_KG)) : "—"}</div><div class="l">kg còn lại</div></div>
    </div>
    ${keys.length < 3 ? `<div class="note plain">Cần ít nhất 3 lần cân trong 7 ngày để có trung bình. Chỉ tin con số trung bình — cân từng ngày lệch ±1kg là bình thường.</div>` : ""}
  </section>`;

  /* strategy */
  const dayDoc = get("day_" + tk) || {};
  const sl = dayDoc.sleep || null;
  const tips = [];
  if (!wid){
    tips.push("<b>Ngày nghỉ:</b> ngủ bù, đi bộ nhẹ, vẫn ăn đủ protein. Cơ được giữ lại trong lúc hồi phục.");
  } else {
    const sleepTip = {lt6:"<b>Ngủ dưới 6 tiếng:</b> giữ nguyên tạ tuần trước, bỏ 1–2 bài cuối, không set nào tới thất bại. Thiếu ngủ khi đang cắt calo làm mất cơ nhiều hơn rõ rệt.",
      "6-7":"<b>Ngủ hơi thiếu:</b> tập bình thường, nhưng hôm nay không cố tăng tạ.",
      "7-8":"<b>Ngủ đủ:</b> bài nào tuần trước đủ rep cận trên ở mọi set thì hôm nay tăng tạ.",
      "8p":"<b>Ngủ tốt:</b> bài nào tuần trước đủ rep cận trên ở mọi set thì hôm nay tăng tạ."}[sl];
    tips.push(sleepTip || "Chọn số giờ ngủ đêm qua để app chỉnh cường độ cho hôm nay.");
    const phase = phaseOf(week);
    if (!(sl === "lt6" && (phase === "Giảm mỡ + tăng tạ" || phase === "Chặng cuối"))) tips.push({"Khớp lại nhịp":"<b>Cường độ:</b> dừng mọi set khi còn dư 3–4 rep. Cơ nhớ lại nhanh, không cần vội.",
      "Giảm mỡ + tăng tạ":"<b>Cường độ:</b> bài 1–2 dừng khi còn dư 2 rep, bài 3–4 còn dư 1–2 rep, bài cô lập được sát thất bại ở set cuối. " + (fatHigh() ? "Mỡ còn nhiều và cơ đang nhớ lại, nên hãy cố thêm rep hoặc tạ mỗi tuần — đây là giai đoạn bạn vẫn tăng cơ được." : "Cố thêm rep hoặc tạ khi đủ sức."),
      "Deload":"<b>Deload:</b> giữ tạ, cắt nửa số set, mọi set còn dư 4 rep.",
      "Chặng cuối":"<b>Chặng cuối:</b> giữ được tạ là thắng. Không thêm set, không thêm bài."}[phase]);
    tips.push("<b>Nghỉ giữa set:</b> 3 phút bài 1–2, 2 phút bài 3–4, khoảng 75 giây bài cô lập. Chạm nút <b>Nghỉ</b> ở mỗi bài để bấm giờ.");
    tips.push("<b>Nhịp:</b> đẩy lên 1–2 giây, hạ xuống 2–3 giây có kiểm soát.");
    tips.push(`<b>Cardio:</b> ${planOf(wid).cardio.toLowerCase()}, ngay sau tạ. Đi bộ dốc ít cản trở việc giữ cơ hơn chạy bộ.`);
  }
  tips.push("<b>Giảm mỡ trước:</b> bước chân và protein mỗi ngày quyết định nhiều hơn số set. Mỗi 1.000 bước đốt thêm khoảng 50 kcal ở cân nặng của bạn. Giảm chậm 1 tuần thì tăng bước chân trước, chưa cắt calo.");
  if (RI) tips.push(`<b>Tốc độ giảm cân:</b> ${RI.msg}`);
  h += `<section class="card"><div class="card-h"><h2>Chiến lược hôm nay</h2><span class="aside">${wid ? phaseOf(week) : "Ngày nghỉ"}</span></div>

    <div class="chips">${SLEEP.map(x => `<button class="chip ${sl === x[0] ? "on" : ""}" data-act="sleep" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>
    <div class="lbl">Bước chân hôm nay</div>
    <div class="steps"><input class="st-in" id="stIn" data-in="steps" inputmode="numeric" placeholder="VD 8500" value="${dayDoc.steps != null ? dayDoc.steps : ""}" aria-label="Số bước chân hôm nay"><div style="flex:1"><div class="st-bar"><i id="stBar" style="width:${Math.min(100, (dayDoc.steps || 0) / 120)}%"></i></div><div class="st-cap" id="stCap">${stepsCap(dayDoc.steps)}</div></div></div>
    <ul class="tips">${tips.map(t => `<li>${t}</li>`).join("")}</ul>

  /* workout */
  h += `<section class="card"><div class="card-h"><h2>Buổi tập</h2>
      <div class="wk-step"><button data-act="wk" data-v="-1" aria-label="Tuần trước">‹</button><span>Tuần ${week}</span><button data-act="wk" data-v="1" aria-label="Tuần sau">›</button></div></div>
    <div class="seg">` + Object.keys(PROGRAMS).map(k => `<button class="${k === progKey() ? "on" : ""}" data-act="prog-set" data-v="${k}">${PROGRAMS[k].name}</button>`).join("") + `</div>` + (progKey() === "upper" && fatHigh() ? `<div class="note">Mỡ đang trên 25%: để giảm mỡ trước, PPL tốt hơn vì tập chân nhiều hơn và tiêu hao nhiều năng lượng hơn. Ưu tiên thân trên hợp lý khi xuống khoảng 22%.</div>` : "") + `
    <div class="chips">` + P.sessions.map(p => `<button class="chip ${p.id === wid ? "on" : ""}" data-act="pick" data-v="${p.id}">${p.label}${get(logId(p.id, week)) ? '<span class="dot"></span>' : ""}</button>`).join("") + `</div>`;

  if (!wid){
    h += `<div class="rest"><div class="big">Nghỉ hoàn toàn</div><p>Chủ nhật là ngày hồi phục duy nhất trong tuần. Đi bộ nhẹ nếu muốn, không tập nặng.</p></div>`;
  } else {
    const p = planOf(wid);
    const deload = week === 8 || week === 9;
    h += `<div class="wo-title">${p.label}</div><div class="wo-sub">${DAYS[p.wd]} · ${p.focus} · ${P.short}${wid !== autoWid ? " · đang ghi bù" : ""}</div>`;
    if ((P.skip[wid] || []).includes(week)) h += `<div class="note">Tuần ${week} chưa chạy buổi này — tuần 1 tập 4 buổi, tuần 2 tập 5 buổi, tuần 3 mới đủ 6.</div>`;
    else if (week <= 2) h += `<div class="note">Tuần khớp lại nhịp: giảm tạ 10–20% so với đỉnh cũ, dừng set khi còn dư 3–4 rep.${p.legs ? " Chưa tập Trap Bar Deadlift nặng." : ""}</div>`;
    else if (deload) h += `<div class="note">Tuần deload (chọn tuần 8 hoặc 9): chỉ bài 1–6, giữ nguyên tạ, cắt nửa số set.</div>`;

    const log = get(logId(wid, week)) || {};
    const s = log.s || {};
    p.ex.forEach((e, i) => {
      const cur = s[i] || {};
      const pv = prevOf(wid, i, week);
      let dt = "—", dc = "";
      if (pv && typeof cur.kg === "number"){ const d = r1(cur.kg - pv.kg); dt = (d > 0 ? "+" : "") + fmt(d); dc = d > 0 ? "up" : d < 0 ? "down" : ""; }
      h += `<div class="ex ${deload && i >= 6 ? "dim" : ""}">
        <div class="ex-top"><div class="ex-no">${i + 1}</div><div><div class="ex-name">${e[0]}</div><div class="ex-sub">${e[1]} · ${e[2]}</div><div class="ex-meta"><button class="rest-b" data-act="rest" data-v="${restFor(i)}">Nghỉ ${mmss(restFor(i))}</button><span>${i >= 6 && !deload ? "giữ tạ · " : ""}${rirFor(i, week, sl)}</span></div></div></div>
        <div class="ex-in">
          <label class="fld"><span>kg</span><input data-in="ex" data-i="${i}" data-k="kg" inputmode="decimal" value="${cur.kg != null ? fmt(cur.kg) : ""}" aria-label="${esc(e[0])} kg"></label>
          <label class="fld"><span>rep</span><input data-in="ex" data-i="${i}" data-k="r" inputmode="numeric" value="${cur.r != null ? cur.r : ""}" aria-label="${esc(e[0])} rep"></label>
          ${pv ? `<button class="last" data-act="copy" data-i="${i}">T${pv.w}<br><b>${fmt(pv.kg)}×${pv.r != null ? pv.r : "?"}</b></button>` : ""}
          <span class="delta ${dc}" id="d${i}">${dt}</span>
        </div></div>`;
    });
    h += `<textarea class="wo-note" data-in="note" placeholder="Ghi chú: cảm giác, khớp có đau không, bỏ bài nào…">${esc(log.note || "")}</textarea>
      <div class="cardio"><span>Sau tạ</span><b>${deload ? "Đi bộ 20 phút" : p.cardio}</b></div>`;
  }
  h += `</section>`;

  /* food */
  const items = dayItems(tk), t = totals(items), tg = targetsFor(pw);
  h += `<section class="card"><div class="card-h"><h2>Ăn hôm nay</h2><span class="aside">${fmtK(t.k)} kcal</span></div>
    <div class="macros">${macroBlock("kcal", t.k, tg.kcal, "")}${macroBlock("protein", t.p, tg.p, "g")}${macroBlock("fat", t.f, tg.f, "g")}${macroBlock("carb", t.c, tg.c, "g")}</div>`;
  if (!items.length) h += `<div class="empty">Chưa ghi món nào. Thêm từ thư viện hoặc chạm bữa mẫu bên dưới.</div>`;
  MEALS.forEach(m => {
    const its = items.filter(it => it.m === m);
    if (!its.length) return;
    h += `<div class="meal-g"><h3><span>${m}</span><span>${fmtK(totals(its).k)} kcal</span></h3>` +
      its.map(it => `<div class="it"><div class="it-m"><div class="it-n">${esc(it.n)}</div><div class="it-q">${esc(it.qt)} · P ${fmt(it.p, 0)}g</div></div><div class="it-k">${fmtK(it.k)}</div><button class="x" data-act="rm" data-v="${it.id}" aria-label="Xoá">×</button></div>`).join("") + `</div>`;
  });
  h += `<div class="btn-row"><button class="btn primary" data-act="go-lib">+ Thêm món</button></div>
    <div class="tpl"><div class="lab">Bữa mẫu theo kế hoạch — chạm để thêm cả bữa</div><div class="chips">` +
    Object.keys(TEMPLATES).map(m => `<button class="chip" data-act="tpl" data-v="${m}">${m} · ${fmtK(TEMPLATES[m].reduce((s, x) => s + kc(x[2], x[3], x[4]), 0))}</button>`).join("") + `</div></div>`;
  if (wid && planOf(wid).legs) h += `<div class="note good">Hôm nay tập chân: thêm 60g cơm chín ở bữa tối (+78 kcal).</div>`;
  h += `</section>`;

  el.innerHTML = h;
  renderSync();
}

/* ================= render: progress ================= */
function chartSVG(map){
  const keys = Object.keys(map).sort();
  if (keys.length < 2) return "";
  const W = 340, H = 170, pl = 34, pr = 8, pt = 10, pb = 24;
  const t0 = parseISO(keys[0]).getTime(), t1 = parseISO(keys[keys.length - 1]).getTime(), span = Math.max(t1 - t0, 864e5);
  const avgs = keys.map(k => avg7(k, map));
  const all = keys.map(k => map[k]).concat(avgs.filter(v => v != null));
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if (hi - lo < 2){ const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  lo -= .3; hi += .3;
  const X = k => pl + (parseISO(k).getTime() - t0) / span * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let path = "";
  keys.forEach((k, i) => { if (avgs[i] != null) path += (path ? "L" : "M") + X(k).toFixed(1) + " " + Y(avgs[i]).toFixed(1); });
  const dots = keys.map(k => `<circle cx="${X(k).toFixed(1)}" cy="${Y(map[k]).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".55"/>`).join("");
  const grid = [hi - .3, (hi + lo) / 2, lo + .3].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--num)">${fmt(v)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cân nặng">${grid}${dots}<path d="${path}" fill="none" stroke="var(--good)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)">${ddmm(keys[0])}</text><text x="${W - pr}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${ddmm(keys[keys.length - 1])}</text></svg>
    <div class="track-cap" style="margin-top:4px"><span>● cân từng ngày</span><span style="color:var(--good)">— trung bình 7 ngày</span></div>`;
}
function renderProg(){

  const la = keys.length ? avg7(keys[keys.length - 1], wm) : null;

      <div class="w-stat"><div class="v">${fmt(lean)}</div><div class="l">kg khối nạc${dLean != null ? ` · ${dLean >= 0 ? "↑" : "↓"}${fmt(Math.abs(dLean))}` : ""}</div></div>
      ${L.smm ? `<div class="w-stat"><div class="v">${fmt(L.smm)}</div><div class="l">kg cơ xương</div></div>` : ""}

  } else {

  }
  h += `<div class="lbl">Thêm lần đo</div>
    <div class="ib-f"><input type="date" id="ibD" value="${todayISO()}" class="full" aria-label="Ngày đo"><input id="ibW" inputmode="decimal" placeholder="Cân (kg)"><input id="ibB" inputmode="decimal" placeholder="% mỡ"><input id="ibS" inputmode="decimal" placeholder="Cơ xương kg (tùy chọn)" class="full"></div>
    <div class="btn-row"><button class="btn primary" data-act="ib-save">Lưu kết quả</button></div>`;
  if (ib.length) h += ib.slice().reverse().map(e => `<div class="row"><span class="grow">${ddmm(e.d)} · ${fmt(e.w)} kg</span><span class="v">${fmt(e.bf)}%</span><button class="x" data-act="ib-del" data-v="${e.id}" aria-label="Xoá">×</button></div>`).join("");
  h += `<p class="muted" style="font-size:12px;margin:10px 0 0">Đo buổi sáng, chưa ăn, sau vệ sinh, không tập trước đó; 4 tuần một lần. 2–3 tuần đầu máy có thể báo "mất cơ" do mất nước và glycogen — nhìn xu hướng qua nhiều lần đo.</p></section>`;

  /* weekly averages */
  const sd = startDate();
  const buckets = {};
  keys.forEach(k => { const m = iso(mondayOf(parseISO(k))); (buckets[m] = buckets[m] || []).push(wm[k]); });
  const bk = Object.keys(buckets).sort().reverse();
  if (bk.length){
    h += `<section class="card"><div class="card-h"><h2>Trung bình từng tuần</h2></div>`;
    bk.forEach((m, i) => {
      const arr = buckets[m], av = arr.reduce((s, v) => s + v, 0) / arr.length;
      const prevM = bk[i + 1], pav = prevM ? buckets[prevM].reduce((s, v) => s + v, 0) / buckets[prevM].length : null;
      const label = sd ? "Tuần " + (Math.floor((parseISO(m) - mondayOf(parseISO(sd))) / (7 * 864e5)) + 1) : "Từ " + ddmm(m);
      const d = pav != null ? av - pav : null;
      h += `<div class="row"><span class="grow">${label} <span class="muted" style="font-size:13px">· ${arr.length} lần cân</span></span><span class="v">${fmt(av)}</span><span class="s" style="color:${d == null ? "var(--muted)" : d < 0 ? "var(--good)" : "var(--bad)"}">${d == null ? "" : (d < 0 ? "↓" : "↑") + fmt(Math.abs(d))}</span></div>`;
    });
    h += `<div class="note plain">Hai tuần liền trung bình không giảm → cắt thêm 100–150 kcal/ngày hoặc đi bộ thêm 15–20 phút. Không cắt mạnh hơn.</div></section>`;
  }

  /* lifts */
  let lifts = "";
  ALL_SESSIONS.forEach(p => {
    let rows = "";
    p.ex.forEach((e, i) => {
      let first = null, last = null;
      for (let w = 3; w <= WEEKS; w++){ const d = get(logId(p.id, w)); if (d && d.s && d.s[i] && typeof d.s[i].kg === "number"){ if (!first) first = {w, kg:d.s[i].kg}; last = {w, kg:d.s[i].kg}; } }
      if (!first) return;
      const d = r1(last.kg - first.kg);
      rows += `<div class="row"><span class="grow">${e[0]}</span><span class="s">${fmt(first.kg)}</span><span class="v">${fmt(last.kg)}</span><span class="s" style="color:${d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--muted)"}">${d > 0 ? "+" : ""}${fmt(d)}</span></div>`;
    });
    if (rows) lifts += `<div class="lift-g">${p.label}</div>` + rows;
  });
  h += `<section class="card"><div class="card-h"><h2>Mức tạ</h2><span class="aside">tuần 3 → mới nhất</span></div>${lifts || '<div class="empty">Chưa có mức tạ từ tuần 3 trở đi. Tuần 1–2 là khớp lại nhịp nên không tính.</div>'}
    ${lifts ? '<div class="note plain">Tuần 3–10: tạ tăng dần là kỳ vọng hợp lý với lượng mỡ hiện tại. Tuần 11–15: đứng yên là bình thường.</div>' : ""}</section>`;

  /* history */
  if (keys.length){
    h += `<section class="card"><div class="card-h"><h2>Lịch sử cân</h2><span class="aside">${keys.length} lần</span></div>` +
      keys.slice(-30).reverse().map(k => `<div class="row"><span class="grow">${DAYS[parseISO(k).getDay()]} · ${ddmm(k)}</span><span class="v">${fmt(wm[k])}</span><button class="x" data-act="w-del" data-v="${k}" aria-label="Xoá">×</button></div>`).join("") + `</section>`;
  }
  el.innerHTML = h;
}

  el.innerHTML = h;

function daysSince(iso2){ return Math.floor((parseISO(todayISO()) - parseISO(iso2)) / 864e5); }
function needBackup(){

}

/* ================= actions ================= */
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1900); }

function addItems(list){
  const key = "day_" + todayISO();
  const d = clone(get(key)) || {items:[]};
  d.items = (d.items || []).concat(list);
  put(key, d);
}

const T = {end:0, iv:null, done:false, lock:null};
function wake(on){
  try {
    if (on && "wakeLock" in navigator && !T.lock) navigator.wakeLock.request("screen").then(l => { T.lock = l; }).catch(() => {});
    if (!on && T.lock){ T.lock.release(); T.lock = null; }
  } catch(e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && T.iv){ T.lock = null; wake(true); tick(); } });
let audioCtx = null;
function beep(){ try { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .35); } catch(e) {} }
function tick(){
  const left = (T.end - Date.now()) / 1000;
  if (left <= 0){
    if (!T.done){
      T.done = true; $("#tV").textContent = "0:00"; $("#tLab").textContent = "Vào set tiếp"; $("#timer").classList.add("done");
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e) {}
      beep(); setTimeout(() => { if (T.done) stopRest(); }, 6000);
    }
    return;
  }
  $("#tV").textContent = mmss(Math.ceil(left));
}
function startRest(sec){
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  T.end = Date.now() + sec * 1000; T.done = false;
  $("#timer").hidden = false; $("#timer").classList.remove("done"); $("#tLab").textContent = "Nghỉ";
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick(); wake(true); renderDock();
}
function stopRest(){ clearInterval(T.iv); T.iv = null; T.done = false; $("#timer").hidden = true; wake(false); renderDock(); }

let resetArm = 0;
const ACTS = {
  rest: v => startRest(Number(v)),
  "ib-save": () => {
    const d = $("#ibD").value, w = num($("#ibW").value), bf = num($("#ibB").value), smm = num($("#ibS").value);
    if (!d) return toast("Chọn ngày đo");
    if (w == null || w < 30 || w > 300) return toast("Nhập cân nặng lúc đo");
    if (bf == null || bf < 3 || bf > 60) return toast("Nhập % mỡ hợp lệ");
    const doc = clone(get("inbody")) || {entries:[]};
    doc.entries = (doc.entries || []).filter(e => e.d !== d).concat([{id:rid(), d, w:r1(w), bf:r1(bf), smm:smm != null ? r1(smm) : null}]);
    put("inbody", doc); render(); toast("Đã lưu kết quả InBody");
  },
  "ib-del": id => { const doc = clone(get("inbody")) || {entries:[]}; doc.entries = doc.entries.filter(e => e.id !== id); put("inbody", doc); render(); },
  "t-add": () => { if (T.done){ T.done = false; T.end = Date.now() + 30000; $("#timer").classList.remove("done"); $("#tLab").textContent = "Nghỉ"; } else T.end += 30000; tick(); },
  "t-stop": () => stopRest(),
  sleep: v => { const key = "day_" + todayISO(); const d = clone(get(key)) || {items:[]}; d.sleep = d.sleep === v ? null : v; put(key, d); render(); },
  "go-research": () => { V.openSec = "research"; ACTS.tab("plan"); const el = document.getElementById("sec-research"); if (el && el.scrollIntoView) el.scrollIntoView({block:"start"}); V.openSec = null; },
  tab: v => { V.tab = v; if (v !== "today") { V.week = null; } closeSheet(); render(); window.scrollTo(0, 0); },
  "set-start": () => { const v = $("#sdIn").value; if (!v) return toast("Chọn ngày trước"); put("settings", Object.assign({}, get("settings"), {startDate:v})); V.week = null; render(); toast("Đã đặt ngày bắt đầu"); },
  "set-start2": () => { const v = $("#sdIn2").value; if (!v) return; put("settings", Object.assign({}, get("settings"), {startDate:v})); toast("Đã lưu ngày bắt đầu"); },
  "w-save": () => {
    const n = num($("#wIn").value);
    if (n == null || n < 30 || n > 300) return toast("Nhập số cân hợp lệ");
    const w = clone(get("weights")) || {map:{}}; w.map = w.map || {}; w.map[todayISO()] = r1(n);
    put("weights", w); $("#wIn").blur(); render(); toast("Đã lưu " + fmt(n) + " kg");
  },
  "w-del": k => { const w = clone(get("weights")) || {map:{}}; delete w.map[k]; put("weights", w); render(); },
  wk: v => { V.week = Math.max(1, Math.min(WEEKS, CTX.week + Number(v))); render(); },
  pick: v => { V.wid = v; render(); },
  copy: i => {
    const pv = prevOf(CTX.wid, Number(i), CTX.week); if (!pv) return;
    const kg = document.querySelector(`[data-in="ex"][data-i="${i}"][data-k="kg"]`), rp = document.querySelector(`[data-in="ex"][data-i="${i}"][data-k="r"]`);
    kg.value = fmt(pv.kg); onEx(kg);
    if (pv.r != null){ rp.value = pv.r; onEx(rp); }
  },
  rm: id => { const key = "day_" + todayISO(); const d = clone(get(key)) || {items:[]}; d.items = d.items.filter(x => x.id !== id); put(key, d); render(); },
  "go-lib": () => { V.libMeal = defaultMeal(); ACTS.tab("lib"); setTimeout(() => { const q = $("#qIn"); if (q) q.focus(); }, 80); },
  tpl: m => {
    addItems(TEMPLATES[m].map(x => ({id:rid(), n:x[0], qt:x[1], m, p:x[2], f:x[3], c:x[4], k:kc(x[2], x[3], x[4])})));
    render(); toast("Đã thêm bữa " + m.toLowerCase());
  },
  grp: v => { V.grp = v; renderLib(); },
  "open-food": k => openFood(k),
  q: v => {
    const f = findFood(SH.key); const step = isMass(f.u) ? (f.def >= 100 ? 10 : 5) : 0.5;
    SH.q = Math.max(step, r1(SH.q + Number(v) * step)); $("#qtyIn").value = fmt(SH.q, isMass(f.u) ? 0 : 1); updatePrev();
    document.querySelectorAll('[data-act="qset"]').forEach(b => b.classList.toggle("on", Number(b.dataset.v) === SH.q));
  },
  qset: v => { SH.q = Number(v); drawFood(); },
  meal: v => { SH.meal = v; V.libMeal = v; document.querySelectorAll('[data-act="meal"]').forEach(b => b.classList.toggle("on", b.dataset.v === v)); },
  "add-food": () => {
    const f = findFood(SH.key); if (!f || !(SH.q > 0)) return;
    const m = macrosOf(f, SH.q);
    addItems([{id:rid(), n:f.n, qt:qtyLabel(f.u, SH.q), m:SH.meal, p:r1(m.p), f:r1(m.f), c:r1(m.c), k:Math.round(m.k)}]);
    closeSheet(); renderDock(); toast("Đã thêm " + f.n);
  },
  "new-food": () => openNewFood(),
  "save-food": () => {
    const n = $("#nfN").value.trim(), u = $("#nfU").value.trim() || "phần", k = num($("#nfK").value);
    if (!n) return toast("Nhập tên món");
    if (k == null || k < 0) return toast("Nhập số kcal");
    const d = clone(get("foods")) || {custom:[]};
    d.custom = (d.custom || []).concat([{id:rid(), n, u, k, p:num($("#nfP").value) || 0, f:num($("#nfF").value) || 0, c:num($("#nfC").value) || 0}]);
    put("foods", d); closeSheet(); V.grp = "Món của tôi"; V.q = ""; const qi = $("#qIn"); if (qi) qi.value = ""; renderLib(); toast("Đã lưu " + n);
  },
  "del-food": () => { const id = SH.key.slice(1); const d = clone(get("foods")) || {custom:[]}; d.custom = d.custom.filter(x => x.id !== id); put("foods", d); closeSheet(); if (!d.custom.length) V.grp = "Tất cả"; renderLib(); },
  "prog-set": v => { if (!PROGRAMS[v] || v === progKey()) return; put("settings", Object.assign({}, get("settings"), {program:v})); V.wid = undefined; render(); toast("Đã chuyển sang " + PROGRAMS[v].name); },
  close: () => closeSheet(),
  export: async () => {
    const data = JSON.stringify({app:"ppl15", exportedAt:new Date().toISOString(), docs:S.docs}, null, 1);
    const name = "giam-can-15-tuan-" + todayISO() + ".json";
    const mark = () => { put("settings", Object.assign({}, get("settings"), {lastBackup:todayISO()})); render(); toast("Đã tạo bản sao lưu"); };
    try {
      const file = new File([data], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Sao lưu giảm cân 15 tuần"}); mark(); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
    try {
      const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); mark(); return;
    } catch(e) {}
    if (V.tab !== "plan"){ V.tab = "plan"; render(); }
    const t = $("#impIn"); if (t){ t.value = data; t.select(); } toast("Không lưu được file — nội dung sao lưu đã hiện trong ô dán để bạn sao chép");
  },
  "import-file": () => { const f = $("#impFile"); if (f) f.click(); },
  import: (txt) => {
    const src = typeof txt === "string" && txt.trim().startsWith("{") ? txt : $("#impIn").value;
    let o; try { o = JSON.parse(src); } catch(e) { return toast("Dữ liệu không đúng định dạng"); }
    let n = 0;
    if (o && o.docs){ Object.keys(o.docs).forEach(id => { put(id, o.docs[id]); n++; }); }
    else if (o && (o.logs || o.weights)){
      Object.keys(o.logs || {}).forEach(k => {
        const [wid, w] = k.split("|"); if (!planOf(wid)) return;
        const s = {}; Object.keys(o.logs[k]).forEach(i => { const e = o.logs[k][i]; s[i] = {}; if (typeof e.kg === "number") s[i].kg = e.kg; if (typeof e.r === "number") s[i].r = e.r; });
        put(logId(wid, Number(w)), {s, note:(o.notes && o.notes[k]) || ""}); n++;
      });
      if (o.weights){ const w = clone(get("weights")) || {map:{}}; w.map = Object.assign(w.map || {}, o.weights); put("weights", w); n++; }
    }
    const ii = $("#impIn"); if (ii) ii.value = ""; render(); toast(n ? "Đã khôi phục dữ liệu" : "Không tìm thấy dữ liệu để khôi phục");
  },
  reset: async () => {
    const b = $("#resetBtn");
    if (Date.now() - resetArm > 4000){ resetArm = Date.now(); b.textContent = "Chạm lần nữa để xoá vĩnh viễn"; return; }
    const ids = Object.keys(S.docs);
    S.docs = {}; S.pending = {}; lsSave();
    if (S.col){ for (const id of ids){ try { await S.col.doc(id).delete(); } catch(e) {} } }
    V.week = null; V.wid = undefined; render(); toast("Đã xoá toàn bộ dữ liệu");
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const fn = ACTS[b.dataset.act]; if (fn) fn(b.dataset.v != null ? b.dataset.v : b.dataset.i);
});

function onEx(inp){
  const i = inp.dataset.i, k = inp.dataset.k, id = logId(CTX.wid, CTX.week);
  const d = clone(get(id)) || {s:{}, note:""};
  d.s = d.s || {};
  const e = Object.assign({}, d.s[i] || {});
  const raw = inp.value.trim();
  if (raw === "") delete e[k]; else { const n = num(raw); if (n == null) return; e[k] = n; }
  if (Object.keys(e).length) d.s[i] = e; else delete d.s[i];
  if (!d.d) d.d = todayISO();
  put(id, d);
  if (k === "kg"){
    const pv = prevOf(CTX.wid, Number(i), CTX.week), el = $("#d" + i);
    if (!el) return;
    el.className = "delta";
    if (pv && typeof e.kg === "number"){ const df = r1(e.kg - pv.kg); el.textContent = (df > 0 ? "+" : "") + fmt(df); if (df) el.classList.add(df > 0 ? "up" : "down"); el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 420); }
    else el.textContent = "—";
  }
  const chip = document.querySelector(`[data-act="pick"][data-v="${CTX.wid}"]`);
  if (chip && !chip.querySelector(".dot")) chip.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
}

document.addEventListener("input", e => {
  const t = e.target, k = t.dataset && t.dataset.in;
  if (!k) return;
  if (k === "ex") onEx(t);
  else if (k === "note"){ const id = logId(CTX.wid, CTX.week); const d = clone(get(id)) || {s:{}}; d.note = t.value; if (!d.d) d.d = todayISO(); put(id, d); }
  else if (k === "steps"){
    const raw = t.value.replace(/[^0-9]/g, ""), n = raw ? parseInt(raw, 10) : null;
    const key = "day_" + todayISO(), d = clone(get(key)) || {items:[]};
    if (n == null) delete d.steps; else d.steps = n;
    put(key, d);
    const bar = $("#stBar"), cap = $("#stCap");
    if (bar) bar.style.width = Math.min(100, (n || 0) / 120) + "%";
    if (cap) cap.textContent = stepsCap(n);
  }
  else if (k === "q"){ V.q = t.value; renderLibList(); }
  else if (k === "qty"){ const n = num(t.value); if (n != null && n > 0){ SH.q = n; updatePrev(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t && t.id === "impFile" && t.files && t.files[0]){
    const r = new FileReader();
    r.onload = () => ACTS.import(String(r.result));
    r.readAsText(t.files[0]);
    t.value = "";
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "wIn"){ e.preventDefault(); ACTS["w-save"](); }
  if (e.key === "Escape") closeSheet();
});

/* ================= boot ================= */
lsLoad();
render();
(function initLocal(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
  try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e) {}
  renderSync();
})();
})();
</script>
</body>
</html>
